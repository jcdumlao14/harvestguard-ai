route:
  receiver: harvestguard-oncall
  group_by:
  - alertname
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1h
receivers:
- name: harvestguard-oncall
  webhook_configs:
  - url: http://api:8001/internal/alerts/alertmanager
    send_resolved: true
    http_config:
      authorization:
        type: Bearer
        credentials_file: /etc/alertmanager/secrets/oncall-token
