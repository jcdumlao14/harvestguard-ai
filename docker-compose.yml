services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harvestguard
      POSTGRES_USER: harvestguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U harvestguard -d harvestguard
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://harvestguard:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/harvestguard
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      OTEL_SERVICE_NAME: harvestguard-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      HARVESTGUARD_RESPONDER_TOKEN: ${HARVESTGUARD_RESPONDER_TOKEN:?Missing responder
        token in .env}
    ports:
    - 8001:8001
    depends_on:
      db:
        condition: service_healthy
      tempo:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8001
    ports:
    - 5174:80
    depends_on:
    - api
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
    - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
    - 19091:9090
    depends_on:
    - api
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
    - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - ./ops/secrets/oncall-token:/etc/alertmanager/secrets/oncall-token:ro
    ports:
    - 9093:9093
  grafana:
    image: grafana/grafana:11.5.2
    ports:
    - 3001:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local_grafana_change_me}
    volumes:
    - grafana_data:/var/lib/grafana
    - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
  tempo:
    image: grafana/tempo:2.7.2
    command:
    - -config.file=/etc/tempo/tempo.yml
    volumes:
    - ./ops/tempo.yml:/etc/tempo/tempo.yml:ro
    - tempo_data:/var/tempo
    ports:
    - "127.0.0.1:13201:3200"
volumes:
  pgdata: null
  grafana_data: null
  tempo_data: {}
